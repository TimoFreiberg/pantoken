# CI — every PR and every push to main. Independent jobs:
#   web-check:   typechecks (protocol/scripts/e2e/parity/svelte) + unit tests.
#   detect-changes: fast paths-filter gate for web-e2e on PRs. Skips e2e when no
#                e2e-relevant files changed (docs-only, buck2 config, .github/, etc.).
#                Tags, pushes, and manual dispatches bypass the gate via web-e2e's
#                if: and always run. Uses !cancelled() so a detect-changes failure
#                never blocks a release (web-e2e runs on tags regardless).
#   web-e2e:     the Playwright e2e suite, sharded 4 ways across isolated mock-driver
#                runners. Each shard boots its own dev server on auto-assigned ports;
#                Vite serves the client, so no production client build runs here.
#                On PRs, only runs when detect-changes reports e2e-relevant=true.
#   desktop:     fmt + clippy for the Tauri shell, on macOS because that's the only
#                target the shell builds for. The hub sidecar must be compiled first —
#                tauri-build stages `externalBin` at compile time and errors if missing.
#                Also CI's production client-build gate: it builds client/dist once,
#                which tauri-build stages as a bundle resource at compile time.
#   rust-server: fmt + buck2 clippy + buck2 build+test for the Rust server, on Linux.
#                Node-free — no client build. Uses the remote cache for trusted PRs/pushes.
#   buck2:       macOS arm64 Buck2 gate — builds all server crates, tests,
#                builds + validates the unsigned headless archive in the RELEASE
#                configuration (release_build=1, real version/SHA), and checks
#                target/test manifests. The release-config steps run on tags +
#                non-release main pushes (and manual dispatches), not PRs.
#                Node-free — no client build. Uses remote cache for trusted
#                PRs/pushes.
#
# The release pipeline (tag-triggered) hangs off these jobs via `needs`; the
# release-prepare jobs build the signed headless artifacts via Buck2
# (`build.ts --builder buck2`, release config) and the desktop bundle via
# Tauri/Cargo; see desktop/README.md "Publishing a release".
#
# Tailscale DNS: the macOS jobs that connect to Tailscale (buck2,
# release-prepare) add a "Revert Tailscale DNS override" step right after
# connecting. tailscale/github-action repoints the runner's system DNS at
# MagicDNS (100.100.100.100), which intermittently breaks public name
# resolution — v0.2.94/v0.2.95 died on buck2's static.crates.io fetches. The
# remote cache is addressed by IP (BUCK2_CACHE_HOST), so the override is
# reverted before any build runs.
#
# Transient network retry: every Buck2 *build* step below runs through
# scripts/ci/retry-transient.sh, which re-runs the command once when its
# output matches transient-looking network/DNS errors (crates.io fetches).
# Test steps deliberately do NOT go through it — test failures are never
# retried. See docs/buck2-policy.md "Transient network retry".

name: CI

on:
  push:
    branches: [main]
    tags: ["v*"]
  pull_request:
    paths-ignore:
      - "**/*.md"
      - "docs/**"
  workflow_dispatch:
    inputs:
      buck2_no_cache:
        description: 'Force Buck2 local execution (no remote cache)'
        type: boolean
        default: false

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

# A release lands as TWO push events for the same commit — refs/heads/main and the
# refs/tags/v* that release.ts pushes right after. Running tests twice buys nothing:
# the tag run is the one that gates the release job, so the test jobs skip the
# branch-push twin. The marker is release.ts's commit subject ("Release vX.Y.Z") —
# load-bearing coupling, noted on both sides. A hand-pushed release commit with a
# different subject just runs twice (the old behavior), never skips the release.
jobs:
  web-check:
    name: web — typecheck, unit
    if: github.ref_type == 'tag' || github.event_name != 'push' || !startsWith(github.event.head_commit.message, 'Release v')
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 11.17.0
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm run check
      - run: pnpm run test

  detect-changes:
    name: detect changes
    # Fast paths-filter gate for web-e2e on PRs. Not a release gate — tags,
    # pushes, and manual dispatches bypass it via web-e2e's if:.
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      e2e-relevant: ${{ steps.filter.outputs.e2e-relevant }}
    steps:
      - uses: actions/checkout@v4
        # dorny/paths-filter diffs against the merge-base on pushes; fetch full
        # history so shallow checkout can't cause a false "no changes" result.
        with:
          fetch-depth: 0
      - uses: dorny/paths-filter@v3
        id: filter
        with:
          filters: |
            e2e-relevant:
              - 'client/**'
              - 'server/**'
              - 'protocol/**'
              - 'e2e/**'
              - 'scripts/**'
              - 'playwright.config.ts'
              - 'playwright.live.config.ts'
              - 'package.json'
              - 'pnpm-lock.yaml'
              - 'rust-toolchain.toml'
              - 'justfile'
              - 'tsconfig*.json'
              - '.nvmrc'

  web-e2e:
    name: web — e2e (${{ matrix.shard }}/4)
    needs: [detect-changes]
    if: ${{ !cancelled() && (github.ref_type == 'tag' || (github.event_name == 'push' && !startsWith(github.event.head_commit.message, 'Release v')) || (github.event_name == 'pull_request' && needs.detect-changes.outputs.e2e-relevant == 'true') || github.event_name == 'workflow_dispatch') }}
    runs-on: ubuntu-latest
    timeout-minutes: 25
    strategy:
      fail-fast: false
      matrix:
        shard: [1, 2, 3, 4]
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 11.17.0
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      # Rust toolchain is pinned via rust-toolchain.toml; rustup auto-installs it.
      # Install Buck2 for dev.ts's buck2 build path
      - name: Install Buck2 + Reindeer
        run: bash scripts/ci/install-buck2-ci.sh
      - name: Add local bin to PATH
        run: echo "$HOME/.local/bin" >> $GITHUB_PATH
      - uses: taiki-e/install-action@v2
        with:
          tool: just
      # Pre-warm the Rust binary via Buck2 so dev.ts answers /health quickly.
      # Retry once on transient network/DNS failures (crates.io fetches).
      - run: bash scripts/ci/retry-transient.sh 'just build-server-rs'
      - name: Cache Playwright browsers
        uses: actions/cache@v4
        with:
          path: ~/.cache/ms-playwright
          key: playwright-${{ runner.os }}-${{ hashFiles('pnpm-lock.yaml') }}
      - run: pnpm exec playwright install --with-deps chromium
      - run: pnpm run test:e2e -- --shard=${{ matrix.shard }}/4
      - name: Upload traces on e2e failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-results-${{ matrix.shard }}
          path: test-results/
          retention-days: 7

  web-live:
    name: web — live e2e (fake daemon)
    # Corpus-backed live tier: the real Rust server (PANTOKEN_DRIVER=fake) over the
    # in-process fake daemon. Gated to manual
    # dispatch until the specs have a confirmed green run — they were authored
    # against the corpus + existing DOM selectors but not yet executed in a browser.
    # Promote to the pull_request/push gate (drop this `if:`) once a dispatch run
    # passes. This is the third leg of the cutover gate (see server/PROGRESS.md).
    if: github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 11.17.0
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      # Install Buck2 for dev.ts's buck2 build path
      - name: Install Buck2 + Reindeer
        run: bash scripts/ci/install-buck2-ci.sh
      - name: Add local bin to PATH
        run: echo "$HOME/.local/bin" >> $GITHUB_PATH
      - uses: taiki-e/install-action@v2
        with:
          tool: just
      # Pre-warm the Rust binary via Buck2 so dev.ts answers /health quickly.
      # The webServer timeout budgets a cold compile, but warming keeps it comfortable.
      # Retry once on transient network/DNS failures (crates.io fetches).
      - run: bash scripts/ci/retry-transient.sh 'just build-server-rs'
      - name: Cache Playwright browsers
        uses: actions/cache@v4
        with:
          path: ~/.cache/ms-playwright
          key: playwright-${{ runner.os }}-${{ hashFiles('pnpm-lock.yaml') }}
      - run: pnpm exec playwright install --with-deps chromium
      - run: pnpm run test:e2e:live
      - name: Upload traces on live e2e failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-live-results
          path: test-results/
          retention-days: 7

  desktop:
    name: desktop shell — fmt, clippy
    if: github.ref_type == 'tag' || github.event_name != 'push' || !startsWith(github.event.head_commit.message, 'Release v')
    runs-on: macos-14
    timeout-minutes: 30
    env:
      CARGO_TARGET_DIR: ${{ github.workspace }}/target
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 11.17.0
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      # tauri-build stages externalBin + resources at compile time; build-hub.ts also
      # ensures client/dist exists so the resource mapping never trips.
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: .
      # Install Buck2 for build-hub.ts's buck2 build path
      - name: Install Buck2 + Reindeer
        run: bash scripts/ci/install-buck2-ci.sh
      - name: Add local bin to PATH
        run: echo "$HOME/.local/bin" >> $GITHUB_PATH
      - uses: taiki-e/install-action@v2
        with:
          tool: just
      # Build the production client — CI's production client-build gate. tauri-build
      # stages client/dist as a bundle resource at compile time, so this must precede
      # the cargo steps below.
      - run: pnpm run build
      - run: bash scripts/ci/retry-transient.sh 'pnpm exec tsx scripts/desktop/build-hub.ts --debug'
      # Run the full vitest suite — deploy-scripts.test.ts exercises macOS-only
      # deploy scripts (launchctl, plutil, shasum) that are skipped on Linux.
      - run: pnpm run test
      - uses: taiki-e/install-action@v2
        with:
          tool: nextest
      - run: cargo fmt --check -p pantoken-desktop
      - run: cargo clippy --locked -p pantoken-desktop --all-targets -- -D warnings
      - run: cargo nextest run -p pantoken-desktop

  rust-server:
    name: rust server — fmt, clippy, buck2 build+test (Linux)
    if: github.ref_type == 'tag' || github.event_name != 'push' || !startsWith(github.event.head_commit.message, 'Release v')
    runs-on: ubuntu-latest
    timeout-minutes: 25
    env:
      TS_AUTH_KEY: ${{ secrets.TS_AUTH_KEY }}
      BUCK2_CACHE_HOST: ${{ secrets.BUCK2_CACHE_HOST }}
      BUCK2_TEST_FORCE_CACHE_UPLOAD: "true"
    steps:
      - uses: actions/checkout@v4
      # Rust toolchain is pinned via rust-toolchain.toml; rustup auto-installs it.
      - run: cargo fmt --all -- --check
      # Install Buck2 + Reindeer for buck2 clippy + build + test
      - name: Install Buck2 + Reindeer
        run: bash scripts/ci/install-buck2-ci.sh
      - name: Add local bin to PATH
        run: echo "$HOME/.local/bin" >> $GITHUB_PATH
      - uses: taiki-e/install-action@v2
        with:
          tool: just
      # Tailscale connection for remote cache (trusted PRs/pushes only).
      # Skips gracefully when TS_AUTH_KEY is not configured (local-only builds).
      - name: Connect to Tailscale
        if: (github.event.pull_request.head.repo.full_name == github.repository || github.event_name == 'push') && !inputs.buck2_no_cache && env.TS_AUTH_KEY != ''
        uses: tailscale/github-action@v4
        with:
          authkey: ${{ secrets.TS_AUTH_KEY }}
          version: latest
      # Fail fast when the cache is unreachable: without this, a runner that
      # never joined the tailnet still writes a cache config and Buck2 then
      # dies on every action with a cryptic "tcp connect error ... Operation
      # timed out" (v0.2.97's failure — TS_AUTH_KEY was empty and the Connect
      # to Tailscale step silently skipped). Gated on the same conditions as
      # Connect to Tailscale; addressed by IP so MagicDNS isn't needed.
      - name: Verify remote cache reachability
        if: (github.event.pull_request.head.repo.full_name == github.repository || github.event_name == 'push') && !inputs.buck2_no_cache && env.TS_AUTH_KEY != '' && env.BUCK2_CACHE_HOST != ''
        env:
          BUCK2_CACHE_HOST: ${{ secrets.BUCK2_CACHE_HOST }}
        run: |
          if ! nc -z -w 5 "$BUCK2_CACHE_HOST" 9092; then
            echo "::error::Remote cache ${BUCK2_CACHE_HOST}:9092 is unreachable from the runner. Check that (1) Connect to Tailscale succeeded and TS_AUTH_KEY is a valid reusable Tailscale auth key, (2) BUCK2_CACHE_HOST is the cache host's current Tailscale IP (run 'tailscale ip -4' on the host), and (3) bazel-remote is running on the host (gRPC on 9092)."
            exit 1
          fi
          echo "Remote cache reachable at ${BUCK2_CACHE_HOST}:9092"
      # Generate remote cache config from secret (writes .buckconfig.local,
      # which buck2 auto-reads — no --config-file flag needed)
      - name: Configure remote cache
        if: (github.event.pull_request.head.repo.full_name == github.repository || github.event_name == 'push') && !inputs.buck2_no_cache && env.TS_AUTH_KEY != '' && env.BUCK2_CACHE_HOST != ''
        env:
          BUCK2_CACHE_HOST: ${{ secrets.BUCK2_CACHE_HOST }}
        run: |
          cat > .buckconfig.local <<EOF
          [buck2_re_client]
          engine_address = $BUCK2_CACHE_HOST:9092
          action_cache_address = $BUCK2_CACHE_HOST:9092
          cas_address = $BUCK2_CACHE_HOST:9092
          tls = false
          instance_name = buck2
          [build]
          execution_platforms = toolchains//platforms:remote_cache
          EOF
      # Buck2 clippy + build + test (uses remote cache via auto-read .buckconfig.local when available).
      # Clippy/build go through retry-transient.sh: one retry on transient
      # network/DNS output only. The test step below is deliberately unwrapped —
      # test failures are never retried.
      - name: Buck2 clippy
        run: bash scripts/ci/retry-transient.sh 'just buck2-clippy'
      - name: Buck2 build
        run: bash scripts/ci/retry-transient.sh 'just build-rs && just build-server-rs'
      - name: Buck2 test
        run: just test-rs
      # Target + test inventory checks
      - name: Buck2 target manifest check
        run: just targets-check-rs
      - name: Buck2 test inventory check
        run: just test-inventory-check-rs

  # Buck2 gate on macOS arm64. Builds all server crates + tests, builds +
  # validates the unsigned headless archive in the RELEASE configuration
  # (release_build=1, real VERSION/BUILD_SHA — the same config the
  # release-prepare jobs use), and checks target/test manifests. Uses remote
  # cache for trusted PRs/pushes (Tailscale + bazel-remote).
  # Fork PRs and manual no-cache dispatches fall back to local-only execution.
  # The release-config archive build + validation steps are skipped on PRs
  # (if: github.event_name != 'pull_request'); they run on tags, non-release
  # main pushes, and manual dispatches. This job is a release gate: it is in
  # the release job's needs, and its release-config archive actions warm the
  # remote cache for the tag-triggered release-prepare jobs (first tag run
  # compiles cold; later runs hit the cache).
  buck2:
    name: buck2 — build, test, archive (macOS arm64)
    if: github.ref_type == 'tag' || github.event_name != 'push' || !startsWith(github.event.head_commit.message, 'Release v')
    runs-on: macos-14
    timeout-minutes: 40
    env:
      TS_AUTH_KEY: ${{ secrets.TS_AUTH_KEY }}
      BUCK2_CACHE_HOST: ${{ secrets.BUCK2_CACHE_HOST }}
      BUCK2_TEST_FORCE_CACHE_UPLOAD: "true"
    steps:
      - uses: actions/checkout@v4
      # Rust toolchain is pinned via rust-toolchain.toml; rustup auto-installs it.
      # Install pinned Buck2 + Reindeer
      - name: Install Buck2 + Reindeer
        run: bash scripts/ci/install-buck2-ci.sh
      - name: Add local bin to PATH
        run: echo "$HOME/.local/bin" >> $GITHUB_PATH
      # Install just (used by buck2-* recipes; not pre-installed on GitHub runners)
      - uses: taiki-e/install-action@v2
        with:
          tool: just
      # Tailscale connection for remote cache (trusted PRs/pushes only).
      # Skips gracefully when TS_AUTH_KEY is not configured (local-only builds).
      - name: Connect to Tailscale
        if: (github.event.pull_request.head.repo.full_name == github.repository || github.event_name == 'push') && !inputs.buck2_no_cache && env.TS_AUTH_KEY != ''
        uses: tailscale/github-action@v4
        with:
          authkey: ${{ secrets.TS_AUTH_KEY }}
          version: latest
      # tailscale/github-action on macOS unconditionally repoints the runner's
      # system DNS at MagicDNS (100.100.100.100), which intermittently breaks
      # public name resolution — the failure class that killed v0.2.94 and
      # v0.2.95 releases (buck2 couldn't resolve static.crates.io). The remote
      # cache is reached by tailnet IP (the BUCK2_CACHE_HOST secret), so
      # MagicDNS isn't needed here: revert the override so public DNS works.
      - name: Revert Tailscale DNS override
        if: (github.event.pull_request.head.repo.full_name == github.repository || github.event_name == 'push') && !inputs.buck2_no_cache && env.TS_AUTH_KEY != ''
        run: |
          sudo networksetup -setdnsservers Ethernet Empty
          sudo networksetup -setsearchdomains Ethernet Empty
      # Fail fast when the cache is unreachable: without this, a runner that
      # never joined the tailnet still writes a cache config and Buck2 then
      # dies on every action with a cryptic "tcp connect error ... Operation
      # timed out" (v0.2.97's failure — TS_AUTH_KEY was empty and the Connect
      # to Tailscale step silently skipped). Gated on the same conditions as
      # Connect to Tailscale; addressed by IP so MagicDNS isn't needed.
      - name: Verify remote cache reachability
        if: (github.event.pull_request.head.repo.full_name == github.repository || github.event_name == 'push') && !inputs.buck2_no_cache && env.TS_AUTH_KEY != '' && env.BUCK2_CACHE_HOST != ''
        env:
          BUCK2_CACHE_HOST: ${{ secrets.BUCK2_CACHE_HOST }}
        run: |
          if ! nc -z -w 5 "$BUCK2_CACHE_HOST" 9092; then
            echo "::error::Remote cache ${BUCK2_CACHE_HOST}:9092 is unreachable from the runner. Check that (1) Connect to Tailscale succeeded and TS_AUTH_KEY is a valid reusable Tailscale auth key, (2) BUCK2_CACHE_HOST is the cache host's current Tailscale IP (run 'tailscale ip -4' on the host), and (3) bazel-remote is running on the host (gRPC on 9092)."
            exit 1
          fi
          echo "Remote cache reachable at ${BUCK2_CACHE_HOST}:9092"
      # Generate remote cache config from secret (writes .buckconfig.local,
      # which buck2 auto-reads — no --config-file flag needed)
      - name: Configure remote cache
        if: (github.event.pull_request.head.repo.full_name == github.repository || github.event_name == 'push') && !inputs.buck2_no_cache && env.TS_AUTH_KEY != '' && env.BUCK2_CACHE_HOST != ''
        env:
          BUCK2_CACHE_HOST: ${{ secrets.BUCK2_CACHE_HOST }}
        run: |
          cat > .buckconfig.local <<EOF
          [buck2_re_client]
          engine_address = $BUCK2_CACHE_HOST:9092
          action_cache_address = $BUCK2_CACHE_HOST:9092
          cas_address = $BUCK2_CACHE_HOST:9092
          tls = false
          instance_name = buck2
          [build]
          execution_platforms = toolchains//platforms:remote_cache
          EOF
      # Clippy + build all server crates + server binary. Both go through
      # retry-transient.sh: one retry on transient network/DNS output only.
      # The test step below is deliberately unwrapped — test failures are
      # never retried.
      - name: Buck2 clippy
        run: bash scripts/ci/retry-transient.sh 'just buck2-clippy'
      - name: Buck2 build
        run: bash scripts/ci/retry-transient.sh 'just build-rs && just build-server-rs'
      # Run all Buck2 tests
      - name: Buck2 test
        run: just test-rs
      # Determine PANTOKEN_VERSION (from tag or desktop/Cargo.toml). Only
      # consumed by the release-config archive build, so skip it on PRs too.
      - name: Determine PANTOKEN_VERSION
        if: github.event_name != 'pull_request'
        run: |
          if [ "${{ github.ref_type }}" = "tag" ]; then
            echo "PANTOKEN_VERSION=$(echo ${{ github.ref_name }} | sed 's/^v//')" >> $GITHUB_ENV
          else
            echo "PANTOKEN_VERSION=$(grep '^version' desktop/Cargo.toml | head -1 | sed 's/version = "\(.*\)"/\1/')" >> $GITHUB_ENV
          fi
      # Build unsigned headless archive in the RELEASE configuration (optimized
      # + stripped binary with the real VERSION/BUILD_SHA). First run on a cold
      # cache recompiles first-party + third-party crates at release flags (new
      # action keys after the dev-config steps above); later runs warm via the
      # remote cache. Skipped on PRs; runs on tags, non-release main pushes,
      # and manual dispatches (see the job comment above).
      - name: Buck2 archive build
        if: github.event_name != 'pull_request'
        env:
          PANTOKEN_BUILD_SHA: ${{ github.sha }}
        # On a cold cache this downloads every third-party crate from
        # crates.io — wrapped in retry-transient.sh to retry once on transient
        # network/DNS output (the failure class that killed v0.2.94).
        run: |
          bash scripts/ci/retry-transient.sh 'cat > .buckconfig.ci <<EOF
          [pantoken]
          version = $PANTOKEN_VERSION
          build_sha = $PANTOKEN_BUILD_SHA
          release_build = 1
          EOF
          buck2 build --config-file .buckconfig.ci //:pantoken_headless_unsigned'
      # Validate the archive under the same release config. Plain
      # validate-archive-rs (no --config-file) would rebuild the sh_test's
      # :pantoken_headless_unsigned resource with the dev config and validate
      # THAT archive — not the release archive built above. Skipped on PRs
      # alongside the release-config build.
      - name: Buck2 archive validation
        if: github.event_name != 'pull_request'
        run: just validate-archive-rs-ci
      # Target + test inventory checks
      - name: Buck2 target manifest check
        run: just targets-check-rs
      - name: Buck2 test inventory check
        run: just test-inventory-check-rs

  # Tag pushes only (scripts/desktop/release.ts creates them): prepare the signed
  # desktop and headless release bundle in parallel with the gates, then publish only
  # after those gates pass. Releases live in TimoFreiberg/pantoken.
  # The minisign key comes from the TAURI_SIGNING_PRIVATE_KEY Actions secret
  # (one-time setup: gh secret set TAURI_SIGNING_PRIVATE_KEY < ~/.tauri/pantoken-shell.key).
  release-prepare:
    name: release — prepare signed desktop + headless artifacts
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: macos-14 # arm64 → the darwin-aarch64 artifact installed apps expect
    # 50m: the job stacks the Tauri cargo release build with a full cold
    # optimized Buck2 compile on the first tag run; later runs warm via the
    # remote cache (see the Tailscale/cache steps below).
    timeout-minutes: 50
    env:
      CARGO_TARGET_DIR: ${{ github.workspace }}/target
      TS_AUTH_KEY: ${{ secrets.TS_AUTH_KEY }}
      BUCK2_CACHE_HOST: ${{ secrets.BUCK2_CACHE_HOST }}
      BUCK2_TEST_FORCE_CACHE_UPLOAD: "true"
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 11.17.0
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      # Rust toolchain is pinned via rust-toolchain.toml; rustup auto-installs it.
      # Install Buck2 + Reindeer — the headless release artifact is Buck2-built
      # (build.ts --builder buck2), so the install moves up front.
      - name: Install Buck2 + Reindeer
        run: bash scripts/ci/install-buck2-ci.sh
      - name: Add local bin to PATH
        run: echo "$HOME/.local/bin" >> $GITHUB_PATH
      - uses: taiki-e/install-action@v2
        with:
          tool: just
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: .
      - name: Install minisign
        run: brew install minisign
      - name: Check minisign
        run: minisign -v
      # Tailscale connection for the Buck2 remote cache (tag pushes; trusted).
      # The buck2 gate job populates the release-config entries on non-release
      # main pushes and tags (PRs skip the release-config build); the
      # release-config action keys are config+source, so they're reusable
      # across tags once populated. Skips gracefully without the secrets.
      #
      # MUST precede the publish.ts step below: tauri's beforeBuildCommand
      # invokes build-hub.ts, whose buck2 command starts this job's buck2
      # daemon. Buck2 freezes the RE client config (engine_address/CAS/AC) at
      # daemon startup, so a daemon started before .buckconfig.local exists
      # runs without the remote cache for the rest of the job, and the headless
      # release build then fails every action with
      # "Internal error (stage: remote_action_cache): ... (No engine address)".
      # See docs/buck2-policy.md "Configuration".
      - name: Connect to Tailscale
        if: (github.event.pull_request.head.repo.full_name == github.repository || github.event_name == 'push') && !inputs.buck2_no_cache && env.TS_AUTH_KEY != ''
        uses: tailscale/github-action@v4
        with:
          authkey: ${{ secrets.TS_AUTH_KEY }}
          version: latest
      # tailscale/github-action on macOS unconditionally repoints the runner's
      # system DNS at MagicDNS (100.100.100.100), which intermittently breaks
      # public name resolution — the failure class that killed v0.2.94 and
      # v0.2.95 releases (buck2 couldn't resolve static.crates.io). The remote
      # cache is reached by tailnet IP (the BUCK2_CACHE_HOST secret), so
      # MagicDNS isn't needed here: revert the override so public DNS works.
      - name: Revert Tailscale DNS override
        if: (github.event.pull_request.head.repo.full_name == github.repository || github.event_name == 'push') && !inputs.buck2_no_cache && env.TS_AUTH_KEY != ''
        run: |
          sudo networksetup -setdnsservers Ethernet Empty
          sudo networksetup -setsearchdomains Ethernet Empty
      # Fail fast when the cache is unreachable: without this, a runner that
      # never joined the tailnet still writes a cache config and Buck2 then
      # dies on every action with a cryptic "tcp connect error ... Operation
      # timed out" (v0.2.97's failure — TS_AUTH_KEY was empty and the Connect
      # to Tailscale step silently skipped). Gated on the same conditions as
      # Connect to Tailscale; addressed by IP so MagicDNS isn't needed.
      - name: Verify remote cache reachability
        if: (github.event.pull_request.head.repo.full_name == github.repository || github.event_name == 'push') && !inputs.buck2_no_cache && env.TS_AUTH_KEY != '' && env.BUCK2_CACHE_HOST != ''
        env:
          BUCK2_CACHE_HOST: ${{ secrets.BUCK2_CACHE_HOST }}
        run: |
          if ! nc -z -w 5 "$BUCK2_CACHE_HOST" 9092; then
            echo "::error::Remote cache ${BUCK2_CACHE_HOST}:9092 is unreachable from the runner. Check that (1) Connect to Tailscale succeeded and TS_AUTH_KEY is a valid reusable Tailscale auth key, (2) BUCK2_CACHE_HOST is the cache host's current Tailscale IP (run 'tailscale ip -4' on the host), and (3) bazel-remote is running on the host (gRPC on 9092)."
            exit 1
          fi
          echo "Remote cache reachable at ${BUCK2_CACHE_HOST}:9092"
      # Generate remote cache config from secret (writes .buckconfig.local,
      # which buck2 auto-reads — no --config-file flag needed)
      - name: Configure remote cache
        if: (github.event.pull_request.head.repo.full_name == github.repository || github.event_name == 'push') && !inputs.buck2_no_cache && env.TS_AUTH_KEY != '' && env.BUCK2_CACHE_HOST != ''
        env:
          BUCK2_CACHE_HOST: ${{ secrets.BUCK2_CACHE_HOST }}
        run: |
          cat > .buckconfig.local <<EOF
          [buck2_re_client]
          engine_address = $BUCK2_CACHE_HOST:9092
          action_cache_address = $BUCK2_CACHE_HOST:9092
          cas_address = $BUCK2_CACHE_HOST:9092
          tls = false
          instance_name = buck2
          [build]
          execution_platforms = toolchains//platforms:remote_cache
          EOF
      - name: Build signed desktop release artifacts
        env:
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ""
          PANTOKEN_BUILD_SHA: ${{ github.sha }}
        run: bash scripts/ci/retry-transient.sh 'pnpm exec tsx scripts/desktop/publish.ts --dry-run --repo TimoFreiberg/pantoken --tag-must-match "${{ github.ref_name }}"'
      # Headless release artifact via Buck2: build.ts --builder buck2 writes
      # .buckconfig.ci (version/build_sha/release_build=1), builds the archive
      # + tar validator, and continues with signing + verification + metadata.
      # Secrets never enter cacheable Buck2 actions (docs/buck2-policy.md).
      - name: Build headless release artifact
        env:
          PANTOKEN_BUILD_SHA: ${{ github.sha }}
          PANTOKEN_RELEASE_BUILD: "1"
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_TEXT: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_TEXT }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ""
        run: bash scripts/ci/retry-transient.sh 'pnpm exec tsx scripts/headless/build.ts --builder buck2 --tag "${{ github.ref_name }}"'
      # Extra hermetic gate: run the archive sh_test against the release-config
      # Buck2 archive (validate-archive-rs-ci passes --config-file .buckconfig.ci,
      # so the test validates the archive built above, not a dev-config one).
      - name: Validate Buck2-built archive (release config)
        run: just validate-archive-rs-ci
      - name: Install trusted tar validator for preparation
        run: test -x target/release/pantoken-tar-validate
      - name: Validate headless artifact
        env:
          PANTOKEN_UPDATE_TEST_MODE: "1"
          PANTOKEN_TAR_VALIDATOR: ${{ github.workspace }}/target/release/pantoken-tar-validate
        run: pnpm exec tsx scripts/headless/validate-artifact.ts target/release/headless/pantoken-headless-macos-aarch64.tar.gz
      - name: Smoke-test compiled headless artifact
        run: |
          mkdir -p target/release/headless/payload
          tar -xzf target/release/headless/pantoken-headless-macos-aarch64.tar.gz \
            -C target/release/headless/payload
          pnpm exec tsx scripts/headless/smoke-test.ts target/release/headless/payload
      - name: Assemble retained release bundle
        run: |
          set -e
          mkdir -p target/release/release-bundle
          cp target/release/bundle/macos/Pantoken.app.tar.gz target/release/release-bundle/
          cp target/release/bundle/macos/Pantoken.app.tar.gz.sig target/release/release-bundle/
          cp target/release/bundle/macos/latest.json target/release/release-bundle/
          cp target/release/headless/pantoken-headless-macos-aarch64.tar.gz target/release/release-bundle/
          cp target/release/headless/pantoken-headless-macos-aarch64.tar.gz.sig target/release/release-bundle/
          cp target/release/headless/release-metadata.json target/release/release-bundle/
      - name: Upload signed release artifacts
        uses: actions/upload-artifact@v4
        with:
          name: signed-release-artifacts-macos
          path: target/release/release-bundle
          retention-days: 1

  # Build + smoke-test the Linux x86_64 headless artifact on a Linux runner.
  # The binary must be compiled natively (no cross-compilation) so the smoke
  # test can actually execute it. This job runs in parallel with the macOS
  # release-prepare and the gate jobs.
  release-prepare-linux:
    name: release — prepare Linux x86_64 headless artifact
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    # 40m: cold Buck2 release compile on the first tag run; later runs warm
    # via the remote cache (see the Tailscale/cache steps below).
    timeout-minutes: 40
    env:
      CARGO_TARGET_DIR: ${{ github.workspace }}/target
      TS_AUTH_KEY: ${{ secrets.TS_AUTH_KEY }}
      BUCK2_CACHE_HOST: ${{ secrets.BUCK2_CACHE_HOST }}
      BUCK2_TEST_FORCE_CACHE_UPLOAD: "true"
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 11.17.0
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      # Rust toolchain is pinned via rust-toolchain.toml; rustup auto-installs it.
      # Install Buck2 + Reindeer — the headless release artifact is Buck2-built
      # (build.ts --builder buck2). The install script handles
      # x86_64-unknown-linux-gnu (installs zstd, symlinks rustc into /usr/bin).
      - name: Install Buck2 + Reindeer
        run: bash scripts/ci/install-buck2-ci.sh
      - name: Add local bin to PATH
        run: echo "$HOME/.local/bin" >> $GITHUB_PATH
      - uses: taiki-e/install-action@v2
        with:
          tool: just
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: .
      - name: Install minisign
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq minisign
      - name: Check minisign
        run: minisign -v
      # Tailscale connection for the Buck2 remote cache (tag pushes; trusted).
      # Without it the cold Linux release compile can exceed the timeout;
      # skips gracefully without the secrets.
      - name: Connect to Tailscale
        if: (github.event.pull_request.head.repo.full_name == github.repository || github.event_name == 'push') && !inputs.buck2_no_cache && env.TS_AUTH_KEY != ''
        uses: tailscale/github-action@v4
        with:
          authkey: ${{ secrets.TS_AUTH_KEY }}
          version: latest
      # Fail fast when the cache is unreachable: without this, a runner that
      # never joined the tailnet still writes a cache config and Buck2 then
      # dies on every action with a cryptic "tcp connect error ... Operation
      # timed out" (v0.2.97's failure — TS_AUTH_KEY was empty and the Connect
      # to Tailscale step silently skipped). Gated on the same conditions as
      # Connect to Tailscale; addressed by IP so MagicDNS isn't needed.
      - name: Verify remote cache reachability
        if: (github.event.pull_request.head.repo.full_name == github.repository || github.event_name == 'push') && !inputs.buck2_no_cache && env.TS_AUTH_KEY != '' && env.BUCK2_CACHE_HOST != ''
        env:
          BUCK2_CACHE_HOST: ${{ secrets.BUCK2_CACHE_HOST }}
        run: |
          if ! nc -z -w 5 "$BUCK2_CACHE_HOST" 9092; then
            echo "::error::Remote cache ${BUCK2_CACHE_HOST}:9092 is unreachable from the runner. Check that (1) Connect to Tailscale succeeded and TS_AUTH_KEY is a valid reusable Tailscale auth key, (2) BUCK2_CACHE_HOST is the cache host's current Tailscale IP (run 'tailscale ip -4' on the host), and (3) bazel-remote is running on the host (gRPC on 9092)."
            exit 1
          fi
          echo "Remote cache reachable at ${BUCK2_CACHE_HOST}:9092"
      # Generate remote cache config from secret (writes .buckconfig.local,
      # which buck2 auto-reads — no --config-file flag needed)
      - name: Configure remote cache
        if: (github.event.pull_request.head.repo.full_name == github.repository || github.event_name == 'push') && !inputs.buck2_no_cache && env.TS_AUTH_KEY != '' && env.BUCK2_CACHE_HOST != ''
        env:
          BUCK2_CACHE_HOST: ${{ secrets.BUCK2_CACHE_HOST }}
        run: |
          cat > .buckconfig.local <<EOF
          [buck2_re_client]
          engine_address = $BUCK2_CACHE_HOST:9092
          action_cache_address = $BUCK2_CACHE_HOST:9092
          cas_address = $BUCK2_CACHE_HOST:9092
          tls = false
          instance_name = buck2
          [build]
          execution_platforms = toolchains//platforms:remote_cache
          EOF
      # Headless release artifact via Buck2 (release config, real version/SHA)
      - name: Build Linux x86_64 headless release artifact
        env:
          PANTOKEN_BUILD_SHA: ${{ github.sha }}
          PANTOKEN_RELEASE_BUILD: "1"
          TAURI_SIGNING_PRIVATE_KEY_TEXT: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_TEXT }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ""
        run: bash scripts/ci/retry-transient.sh 'pnpm exec tsx scripts/headless/build.ts --builder buck2 --target x86_64-unknown-linux-gnu --tag "${{ github.ref_name }}"'
      - name: Install trusted tar validator for preparation
        run: test -x target/release/pantoken-tar-validate
      - name: Validate Linux headless artifact
        env:
          PANTOKEN_UPDATE_TEST_MODE: "1"
          PANTOKEN_TAR_VALIDATOR: ${{ github.workspace }}/target/release/pantoken-tar-validate
        run: pnpm exec tsx scripts/headless/validate-artifact.ts target/release/headless/pantoken-headless-linux-x86_64.tar.gz
      - name: Smoke-test compiled Linux headless artifact
        run: |
          mkdir -p target/release/headless/payload
          tar -xzf target/release/headless/pantoken-headless-linux-x86_64.tar.gz \
            -C target/release/headless/payload
          pnpm exec tsx scripts/headless/smoke-test.ts target/release/headless/payload
      - name: Assemble Linux release bundle
        run: |
          set -e
          mkdir -p target/release/release-bundle
          cp target/release/headless/pantoken-headless-linux-x86_64.tar.gz target/release/release-bundle/
          cp target/release/headless/pantoken-headless-linux-x86_64.tar.gz.sig target/release/release-bundle/
          cp target/release/headless/release-metadata.json target/release/release-bundle/release-metadata-linux.json
      - name: Upload Linux release artifacts
        uses: actions/upload-artifact@v4
        with:
          name: signed-release-artifacts-linux
          path: target/release/release-bundle
          retention-days: 1

  release:
    name: release — publish
    if: startsWith(github.ref, 'refs/tags/v')
    needs: [web-check, web-e2e, desktop, rust-server, buck2, release-prepare, release-prepare-linux]
    runs-on: macos-14 # publish.ts validates the macOS bundle with plutil
    timeout-minutes: 10
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 11.17.0
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: Download macOS release artifacts
        uses: actions/download-artifact@v4
        with:
          name: signed-release-artifacts-macos
          path: target/release/release-bundle
      - name: Download Linux release artifacts
        uses: actions/download-artifact@v4
        with:
          name: signed-release-artifacts-linux
          path: target/release/release-bundle-linux
      - name: Merge Linux artifacts into release bundle
        run: |
          set -e
          cp target/release/release-bundle-linux/pantoken-headless-linux-x86_64.tar.gz \
             target/release/release-bundle/
          cp target/release/release-bundle-linux/pantoken-headless-linux-x86_64.tar.gz.sig \
             target/release/release-bundle/
          # Merge per-target metadata into the macOS metadata (which already
          # has the desktop assets). The merged file is what publish.ts validates.
          pnpm exec tsx scripts/headless/merge-metadata.ts \
            target/release/release-bundle/release-metadata.json \
            target/release/release-bundle-linux/release-metadata-linux.json
      - name: Validate retained release bundle
        run: |
          test -f target/release/release-bundle/Pantoken.app.tar.gz
          test -f target/release/release-bundle/Pantoken.app.tar.gz.sig
          test -f target/release/release-bundle/latest.json
          test -f target/release/release-bundle/pantoken-headless-macos-aarch64.tar.gz
          test -f target/release/release-bundle/pantoken-headless-macos-aarch64.tar.gz.sig
          test -f target/release/release-bundle/pantoken-headless-linux-x86_64.tar.gz
          test -f target/release/release-bundle/pantoken-headless-linux-x86_64.tar.gz.sig
          test -f target/release/release-bundle/release-metadata.json
      - name: Publish release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          PANTOKEN_RELEASE_REPO: TimoFreiberg/pantoken
          PANTOKEN_RELEASE_BUNDLE_DIR: target/release/release-bundle
        run: >
          pnpm exec tsx scripts/desktop/publish.ts
          --skip-build
          --repo TimoFreiberg/pantoken
          --tag-must-match "${{ github.ref_name }}"

[package]
name = "pantoken-server"
version = "0.1.0"
description = "Axum-based WS bridge + HTTP server for pantoken (the binary)"
edition.workspace = true
rust-version.workspace = true
build = "build.rs"

[[bin]]
name = "pantoken-server"
path = "src/main.rs"

[dependencies]
pantoken-protocol = { workspace = true }
pantoken-daemon-types = { workspace = true }
pantoken-remote-layout = { workspace = true }
serde = { workspace = true }
serde_json = { workspace = true }
tokio = { workspace = true }
axum = { workspace = true }
reqwest = { workspace = true }
tower = { workspace = true }
tower-http = { workspace = true }
tracing = { workspace = true }
tracing-subscriber = { workspace = true }
libc = { workspace = true }
tempfile = { workspace = true }
async-trait = { workspace = true }
parking_lot = { workspace = true }
flate2 = { workspace = true }
futures-util = { workspace = true }
tokio-stream = { workspace = true }
urlencoding = { workspace = true }
web-push = { workspace = true }
ece = { workspace = true }
jwt-simple = { workspace = true }
ct-codecs = { workspace = true }
chrono = { workspace = true }
rand = { workspace = true }
ignore = { workspace = true }
notify = { workspace = true }
# Pinned to 0.2 to match `web-push`'s `http` — used by the reqwest-based push
# client to translate web-push's http 0.2 request/response types.
http = "0.2"

[dev-dependencies]
# Pinning distinct mtimes in `list_session_ids` sort tests (mirrors Node's `utimesSync`).
filetime = "0.2"
# WS client for the adapter contract tests (AC.1).
tokio-tungstenite = "0.29"
futures-util = { version = "0.3", features = ["sink", "std"] }

# Test inventory for the Buck2 POC.
# Lists every selected test target, its data inputs, executable dependencies,
# environment allowlist/clears, socket/temp-root behavior, and network policy.
# The `just buck2-test-inventory-check` validates one-to-one coverage against
# the expected-target manifest and rejects undeclared entries.
#
# Schema:
#   label        — Buck2 test target label
#   data         — list of declared data inputs
#   executables  — list of declared runtime executables
#   env_set      — env vars explicitly set by the test
#   env_clear    — env vars that must be unset for hermeticity
#   socket       — "none" or description of socket usage
#   temp_root    — how temp files are handled
#   network      — "none" (no network) or description

[[tests]]
label = "//server-rs/pantoken-protocol:fold_corpus_tests"
data = ["//server-rs/pantoken-protocol:fold_corpus_data"]
executables = []
env_set = ["PANTOKEN_FOLD_CORPUS_DIR"]
env_clear = []
socket = "none"
temp_root = "none"
network = "none"


# Expected target manifest for the Buck2 POC.
# Maps Buck2 labels to Cargo packages/targets, kinds, source sets,
# dependency/proc-macro edges, and test status.
# The query comparison check (`just targets-check-rs`) validates
# that the Buck2 graph exactly matches this manifest — failing on
# omissions or unexpected targets, including desktop/frontend targets.
#
# Schema:
#   label     — Buck2 target label
#   cargo     — Cargo package/target name (or null for non-Cargo targets)
#   kind      — library, binary, test, integration_test, filegroup, genrule, sh_test
#   crate     — Rust crate name (for library/binary/test targets)
#   test      — true if this target is a test
#   package   — Cargo package name
#   deps      — list of first-party deps (not third-party)

[[targets]]
label = "//server-rs/pantoken-protocol:pantoken_protocol"
cargo = "pantoken-protocol"
kind = "library"
crate = "pantoken_protocol"
test = false
package = "pantoken-protocol"

[[targets]]
label = "//server-rs/pantoken-protocol:fold_corpus_tests"
cargo = "pantoken-protocol"
kind = "integration_test"
crate = "fold_corpus_tests"
test = true
package = "pantoken-protocol"

